{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Практики Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'practices/style.css' %}">
</head>
<body>
<main>
    <nav>
        <a href="{% url 'dogs' %}">Практика 2: собаки</a>
        <a href="{% url 'team' %}">Практика 3: покемоны</a>
    </nav>
    {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
